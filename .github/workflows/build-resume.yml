name: Build Resume PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'assets/resume/**'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AZcore
        uses: actions/checkout@v4

      - name: Compile awesome-cv with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: assets/resume
          root_file: main.tex
          latexmk_use_xelatex: true
          pre_compile: |
            mkdir -p /usr/local/share/fonts/source-sans
            curl -sL https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip -o /tmp/ss3.zip
            unzip -qo /tmp/ss3.zip -d /usr/local/share/fonts/source-sans
            fc-cache -fv

      - name: Copy PDF to assets/about/resume.pdf
        run: |
          mkdir -p assets/about
          cp assets/resume/main.pdf assets/about/resume.pdf

      - name: Commit updated resume.pdf
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/about/resume.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: rebuild assets/about/resume.pdf" && git push)